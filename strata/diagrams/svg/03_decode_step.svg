  <text x="243.80200000000002" y="523" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">pool(x_f, ids, weights)：只算未命中专家</text>
</g>
<g class="message" data-from="P" data-to="H" data-label="parts（k × n_embd fp32）" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="383.802" y1="573" x2="103.80199999999999" y2="573" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="243.80200000000002" y="563" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">parts（k × n_embd fp32）</text>
</g>
<g class="message" data-from="H" data-to="G" data-label="H2D parts → VRAM" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="103.80199999999999" y1="613" x2="243.802" y2="613" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="173.802" y="603" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">H2D parts → VRAM</text>
</g>
<g class="message" data-from="H" data-to="G" data-label="launch post[l]：combine + gr_write" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="103.80199999999999" y1="653" x2="243.802" y2="653" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="173.802" y="643" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">launch post[l]：combine + gr_write</text>
</g>
<g class="message" data-from="H" data-to="G" data-label="launch pre[l+1]" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="103.80199999999999" y1="693" x2="243.802" y2="693" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="173.802" y="683" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">launch pre[l+1]</text>
</g>
<g class="message" data-from="G" data-to="G" data-label="lm_head → logits" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="243.802,733 273.802,733 273.802,753 243.802,753" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="281.802" y="743" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">lm_head → logits</text>
</g>
<g class="message" data-from="H" data-to="H" data-label="argmax 接受 a 个草稿；commit 回放状态" data-line-style="solid" data-arrow-head="filled" data-self="true">
