  <line x1="243.802" y1="353" x2="103.80199999999999" y2="353" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="173.802" y="343" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">doorbell 写 h_seq（约 0.05 ms 可见）</text>
</g>
