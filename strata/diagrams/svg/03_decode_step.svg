  <polygon points="296.457,841 302.457,847 296.457,847" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="173.802" y="852.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">采样在图外；窗末 token 是白得的 bonus token</text>
</g>
<g class="actor" data-id="H" data-label="主线程 host" data-type="participant">
  <rect x="50.88849999999999" y="30" width="105.827" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="103.80199999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">主线程 host</text>
</g>
<g class="actor" data-id="G" data-label="GPU 主流" data-type="participant">
