</g>
<g class="note" data-position="over" data-actors="H,G">
  <polygon points="30,138 311.604,138 317.604,144 317.604,161 30,161" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="311.604,138 317.604,144 311.604,144" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="173.802" y="149.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">一个验证窗（T 行）过 48 层；下面是一层内的交接</text>
</g>
<g class="note" data-position="over" data-actors="H,G">
