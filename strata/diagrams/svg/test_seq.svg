<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 507.603 431" width="507.603" height="431" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=PingFang%20SC%2C%20Hiragino%20Sans%20GB%2C%20Microsoft%20YaHei%2C%20Helvetica%20Neue%2C%20Arial:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="loop" data-label="每个 prefill chunk">
  <rect x="140" y="173" width="337.603" height="60" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="140" y="173" width="141.07000000000002" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="146" y="182" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">loop [每个 prefill chunk]</text>
</g>
<g class="block" data-type="loop" data-label="每个验证窗">
  <rect x="140" y="241" width="337.603" height="60" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="140" y="241" width="114.67" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="146" y="250" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">loop [每个验证窗]</text>
</g>
<line class="lifeline" data-actor="C" x1="70" y1="70" x2="70" y2="401" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="S" x1="216.2515" y1="70" x2="216.2515" y2="401" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="E" x1="395.053" y1="70" x2="395.053" y2="401" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="C" data-to="S" data-label="POST /v1/chat/completions" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="90" x2="216.2515" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="143.12574999999998" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">POST /v1/chat/completions</text>
</g>
<g class="message" data-from="S" data-to="E" data-label="GEN 256 ...ids" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="216.2515" y1="145" x2="395.053" y2="145" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="305.65225" y="135" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">GEN 256 ...ids</text>
</g>
<g class="message" data-from="E" data-to="S" data-label="PP position tokens ms tok/s" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="395.053" y1="213" x2="216.2515" y2="213" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="305.65225" y="203" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">PP position tokens ms tok/s</text>
</g>
<g class="message" data-from="E" data-to="S" data-label="T id" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="395.053" y1="281" x2="216.2515" y2="281" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="305.65225" y="271" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">T id</text>
</g>
<g class="message" data-from="E" data-to="S" data-label="DONE generated ... stop" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="395.053" y1="321" x2="216.2515" y2="321" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="305.65225" y="311" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">DONE generated ... stop</text>
</g>
<g class="message" data-from="S" data-to="C" data-label="SSE data: chunk" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="216.2515" y1="361" x2="70" y2="361" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="143.12574999999998" y="351" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">SSE data: chunk</text>
</g>
<g class="note" data-position="over" data-actors="S">
  <polygon points="128.58249999999998,98 297.92050000000006,98 303.92050000000006,104 303.92050000000006,121 128.58249999999998,121" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="297.92050000000006,98 303.92050000000006,104 297.92050000000006,104" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="216.25150000000002" y="109.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">模板渲染 + 分词 + 上下文检查</text>
</g>
<g class="actor" data-id="C" data-label="客户端" data-type="participant">
  <rect x="30" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="70" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">客户端</text>
</g>
<g class="actor" data-id="S" data-label="serve/server.py" data-type="participant">
  <rect x="150" y="30" width="132.503" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="216.2515" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">serve/server.py</text>
</g>
<g class="actor" data-id="E" data-label="引擎 strata --serve" data-type="participant">
  <rect x="322.503" y="30" width="145.10000000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="395.053" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">引擎 strata --serve</text>
</g>
</svg>